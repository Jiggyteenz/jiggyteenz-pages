<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment &middot; Jiggy Teenz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
color:#0d0d12;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:460px}
.card{background:#fff;border-radius:26px;overflow:hidden;border:1px solid #e6e8ec;
box-shadow:0 18px 50px rgba(13,13,18,.10);animation:rise .5s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.head{background:#0d0d12;padding:24px 26px}
.logo{font-size:25px;font-weight:900;letter-spacing:-.6px;color:#fff;line-height:1}
.logo span{color:#b8dc26}
.tag{font-size:10.5px;letter-spacing:2.4px;color:#9aa0ad;margin-top:5px;font-weight:600}
.body{padding:36px 26px 30px;text-align:center}
.badge{width:92px;height:92px;border-radius:50%;background:linear-gradient(135deg,#c9f318,#8fb00f);
display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 18px;
animation:pop .55s cubic-bezier(.34,1.56,.64,1) .15s both}
.badge.warn{background:linear-gradient(135deg,#fbbf24,#f59e0b)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
h1{font-size:24px;line-height:1.24;margin-bottom:10px}
p.msg{font-size:15.5px;line-height:24px;color:#5b5f6b}
.note{background:#f6f7f9;border:1px solid #eceef2;border-radius:14px;padding:15px 17px;margin-top:22px;text-align:left}
.note p{font-size:13.5px;line-height:20px;color:#5b5f6b}
.foot{background:#f6f7f9;padding:16px 22px;text-align:center;border-top:1px solid #eceef2}
.foot p{font-size:12px;color:#9aa0ad;line-height:19px}
a{color:#7d9a0d;text-decoration:none;font-weight:700}
.close{font-size:12.5px;color:#9aa0ad;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="logo">JIGGY<span>TEENZ</span></div>
      <div class="tag">MOVE. CONNECT. GROW.</div>
    </div>
    <div class="body">
      <div class="badge" id="badge">&#127881;</div>
      <h1 id="title">Payment received!</h1>
      <p class="msg" id="msg">Head back to the app &mdash; everything is waiting for you.</p>
      <div class="note" id="note">
        <p><strong>Not showing yet?</strong> Pull down to refresh in the app. Payments usually
        land within a few seconds.</p>
      </div>
      <p class="close">You can close this page and return to the app.</p>
    </div>
    <div class="foot">
      <p>Jiggy Teenz &middot; Questions? <a href="mailto:info@jiggyteenz.co.uk">info@jiggyteenz.co.uk</a></p>
    </div>
  </div>
</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var status = (q.get('status') || 'success').toLowerCase();
  var badge = document.getElementById('badge');
  var title = document.getElementById('title');
  var msg = document.getElementById('msg');
  var note = document.getElementById('note');

  if (status === 'cancelled') {
    badge.className = 'badge warn';
    badge.innerHTML = '&#128179;';
    title.textContent = 'Payment cancelled';
    msg.textContent = 'No money has been taken. You can try again any time from your Wallet.';
    note.innerHTML = '<p><strong>Changed your mind?</strong> No problem at all \u2014 nothing was charged.</p>';
  } else {
    badge.innerHTML = '&#127881;';
    title.textContent = 'Payment received!';
    msg.textContent = 'Thank you. Head back to the app \u2014 your coins or pass are ready.';
  }
})();
</script>
</body>
</html>
